<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>/fit/ - Health &amp; Fitness</title>
  <style>
    /* Yotsuba B — matched to live boards.4chan.org/fit/ */
    html, body { margin: 0; padding: 0; }
    body {
      background: #EEF2FF;
      color: #000;
      font: 10pt 'arial', 'helvetica', sans-serif;
    }
    a { color: #34345C; text-decoration: none; }
    a:hover { color: #DD0000; }

    /* Top board nav */
    .boardnav {
      font-size: 9pt;
      padding: 2px 6px;
      color: #34345C;
      background: #EEF2FF;
    }
    .boardnav a { color: #34345C; }
    .boardnav .sep { color: #B7C5D9; margin: 0 1px; }
    .boardnav b { color: #000; }

    /* Big board header */
    .boardhdr {
      text-align: center;
      padding: 6px 0 0 0;
    }
    .boardhdr h1 {
      margin: 0;
      font: bold 28px 'tahoma', 'arial', sans-serif;
      color: #AF0A0F;
    }
    .boardhdr .sub {
      font: italic 10pt 'arial', sans-serif;
      color: #800;
      padding: 1px 0 6px;
    }

    .threadbar {
      padding: 4px 8px;
      font-size: 9pt;
      color: #34345C;
    }

    .wrap {
      padding: 4px 8px 220px 8px;
    }

    /* Reply count line ("31 replies and 5 images omitted...") */
    .replycount {
      font-size: 9pt;
      color: #707070;
      padding: 4px 0 4px 0;
    }
    .replycount a { color: #34345C; }

    /* OP post layout — no box, image float left, file info above */
    .post-op {
      padding: 0 0 6px 0;
      max-width: 900px;
    }
    .fileinfo {
      font-size: 9pt;
      color: #000;
      padding: 0 0 1px 0;
    }
    .fileinfo a { color: #34345C; text-decoration: underline; }
    .fileinfo .meta { color: #707070; }
    .filewrap {
      float: left;
      margin: 2px 12px 4px 0;
    }
    .thumb {
      width: 125px;
      height: 125px;
      display: block;
      object-fit: cover;
      background:
        repeating-linear-gradient(45deg, #555 0px, #555 2px, #777 2px, #777 4px);
    }

    .posthead {
      font-size: 10pt;
      color: #000;
    }
    .posthead .checkbox {
      font-size: 10pt;
      color: #707070;
      margin-right: 2px;
    }
    .posthead .subject {
      color: #0F0C5D;
      font-weight: bold;
      margin-right: 4px;
    }
    .posthead .name {
      color: #117743;
      font-weight: bold;
      margin-right: 4px;
    }
    .posthead .name.you::after {
      content: " (You)";
      color: #555;
      font-weight: normal;
    }
    .posthead .time { color: #000; margin-right: 4px; }
    .posthead .num {
      color: #000;
    }
    .posthead .num a { color: #000; text-decoration: none; }
    .posthead .num a:hover { color: #DD0000; }
    .posthead .reply-link {
      margin-left: 2px;
    }
    .posthead .reply-link a { color: #34345C; }
    .posthead .triangle {
      color: #34345C;
      margin-left: 4px;
    }
    .posthead .replyref {
      color: #DD0000;
      text-decoration: underline;
      cursor: pointer;
      font-size: 10pt;
      margin-right: 4px;
    }

    .body {
      font: 10pt 'arial', 'helvetica', sans-serif;
      color: #000;
      white-space: pre-wrap;
      word-wrap: break-word;
      padding: 4px 0 0 0;
      max-width: 720px;
    }
    .body .gt { color: #789922; }
    .body .quotelink {
      color: #DD0000;
      text-decoration: underline;
    }
    .body.typing { color: #888; font-style: italic; }

    /* Reply post — boxed, indented, leading caret marker */
    .reply-row {
      padding: 2px 0;
      margin: 0;
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }
    .reply-row .caret {
      color: #34345C;
      font-size: 10pt;
      padding-top: 1px;
      flex-shrink: 0;
      width: 16px;
      text-align: right;
    }
    .reply-box {
      background: #D6DAF0;
      border: 1px solid #B7C5D9;
      padding: 2px 6px 4px 6px;
      display: inline-block;
      max-width: calc(100% - 24px);
      box-sizing: border-box;
    }
    /* indent each reply slightly more than the OP */
    .reply-row.lvl-1 { margin-left: 12px; }

    .clear { clear: both; }

    /* Quick-reply box (4chan-style QR popup, fixed at bottom) */
    .qr {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #D6DAF0;
      border-top: 1px solid #B7C5D9;
    }
    .qr .qrhdr {
      background: linear-gradient(#FFFFFF, #DCDCDC);
      border-bottom: 1px solid #B7C5D9;
      font-size: 9pt;
      color: #34345C;
      padding: 2px 10px;
      font-weight: bold;
    }
    .qr .qrbody {
      padding: 6px 8px 8px 8px;
      display: grid;
      grid-template-columns: 70px 1fr 80px;
      gap: 3px 4px;
      font-size: 10pt;
      max-width: 1080px;
    }
    .qr label {
      color: #34345C;
      align-self: center;
      font-size: 9pt;
    }
    .qr input.field {
      background: #FFF;
      border: 1px solid #B7C5D9;
      padding: 1px 3px;
      font: 10pt 'arial';
      color: #000;
      height: 18px;
      grid-column: 2 / 3;
    }
    #composeText {
      grid-column: 2 / 3;
      grid-row: 3 / 4;
      background: #FFF;
      border: 1px solid #B7C5D9;
      color: #000;
      font: 10pt 'arial', 'helvetica', sans-serif;
      padding: 3px 4px;
      resize: none;
      min-height: 56px;
      max-height: 200px;
      overflow-y: auto;
      width: 100%;
    }
    #composeText:focus { outline: 1px solid #34345C; }
    #btnSend {
      grid-column: 3 / 4;
      grid-row: 3 / 4;
      align-self: end;
      background: linear-gradient(#FFFFFF, #DCDCDC);
      border: 1px solid #B7C5D9;
      color: #000;
      font: 10pt 'arial';
      padding: 4px 14px;
      cursor: pointer;
      height: 24px;
    }
    #btnSend:hover { background: linear-gradient(#FFFFFF, #C0C0C0); }
    #btnSend:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>

  <div class="boardnav">
    [<a href="#">a</a><span class="sep">/</span><a href="#">b</a><span class="sep">/</span><a href="#">co</a><span class="sep">/</span><b>fit</b><span class="sep">/</span><a href="#">g</a><span class="sep">/</span><a href="#">k</a><span class="sep">/</span><a href="#">lit</a><span class="sep">/</span><a href="#">r9k</a><span class="sep">/</span><a href="#">x</a>]
    &nbsp;[<a href="/wall/">Home</a>]
    &nbsp;[<a href="/wall/">/wall/</a>]
  </div>

  <div class="boardhdr">
    <h1>/fit/ - Health &amp; Fitness</h1>
    <div class="sub">discipline / shame / repeat</div>
  </div>

  <div class="threadbar">
    [<a href="/">Catalog</a>]
    [<a href="/">Bottom</a>]
    &nbsp;&nbsp;Posting mode: Reply
  </div>

  <div class="wrap" id="wrap">
    <div id="messages"></div>
  </div>

  <div class="qr">
    <div class="qrhdr">Reply to thread</div>
    <div class="qrbody">
      <label>Name</label>
      <input class="field" type="text" value="Anonymous" disabled>
      <label>Subject</label>
      <input class="field" type="text" id="subjectField" placeholder="(auto from first post)">
      <label>Comment</label>
      <textarea id="composeText" rows="3" placeholder="Enter to post · Shift+Enter for newline"></textarea>
      <button id="btnSend">Post</button>
    </div>
  </div>

<script>
const SLUG = "{{ slug }}";
const SESSION_ID = {{ session_id }};

const messagesEl = document.getElementById("messages");
const composeEl = document.getElementById("composeText");
const sendBtn = document.getElementById("btnSend");
const subjectField = document.getElementById("subjectField");

let postCount = 0;
let lastPostNumber = null;
const seedNum = 7 * 10000000 + Math.floor(Math.random() * 9_000_000);

function fmtChanTime(d) {
  const pad = n => String(n).padStart(2, "0");
  const dows = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${String(d.getFullYear()).slice(2)}(${dows[d.getDay()]})${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function _renderBody(text) {
  return text.split("\n").map(line =>
    line.startsWith(">") ? `<span class="gt">${escHtml(line)}</span>` : escHtml(line)
  ).join("\n");
}

function fakeFileInfo() {
  const kb = (Math.random() * 4 + 0.2).toFixed(2) + " MB";
  const w = 480 + Math.floor(Math.random() * 800);
  const h = 480 + Math.floor(Math.random() * 800);
  const tag = ["spreadsheet","mirror","scale","fridge_2am","mog","gymrat",
               "dyel","cope","ankles","void","Japanese_buddhist_monk_by"][Math.floor(Math.random()*11)];
  return {filename: `${tag}.jpg`, kb, w, h};
}

function buildPostHead({isOp, num, role, replyToNum, subject}) {
  const head = document.createElement("div");
  head.className = "posthead";

  const cb = document.createElement("span");
  cb.className = "checkbox";
  cb.innerHTML = "&#9744;";  // empty checkbox
  head.appendChild(cb);

  if (isOp && subject) {
    const subj = document.createElement("span");
    subj.className = "subject";
    subj.textContent = subject;
    head.appendChild(subj);
  }

  const name = document.createElement("span");
  name.className = "name" + (role === "user" ? " you" : "");
  name.textContent = "Anonymous";
  head.appendChild(name);

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = fmtChanTime(new Date());
  head.appendChild(time);

  const numSpan = document.createElement("span");
  numSpan.className = "num";
  numSpan.innerHTML = `No.<a href="#p${num}">${num}</a>`;
  head.appendChild(numSpan);

  const reply = document.createElement("span");
  reply.className = "reply-link";
  reply.innerHTML = `[<a href="#p${num}">Reply</a>]`;
  head.appendChild(reply);

  if (replyToNum !== null) {
    const tri = document.createElement("span");
    tri.className = "triangle";
    tri.textContent = "▶";
    head.appendChild(tri);
    const ref = document.createElement("a");
    ref.className = "replyref";
    ref.href = "#p" + replyToNum;
    ref.textContent = ">>" + replyToNum;
    head.appendChild(ref);
  }

  return head;
}

function renderPost(role, text, opts) {
  opts = opts || {};
  const isOp = postCount === 0;
  const num = seedNum + postCount;
  postCount++;

  if (isOp) {
    // OP: no box, image float left, file info on top, header below image, body wraps right
    const post = document.createElement("div");
    post.className = "post-op";
    post.id = "p" + num;

    const fi = fakeFileInfo();
    const fileinfo = document.createElement("div");
    fileinfo.className = "fileinfo";
    fileinfo.innerHTML = `File: <a href="#">${fi.filename}</a> <span class="meta">(${fi.kb}, ${fi.w}x${fi.h})</span>`;
    post.appendChild(fileinfo);

    const filewrap = document.createElement("div");
    filewrap.className = "filewrap";
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    filewrap.appendChild(thumb);
    post.appendChild(filewrap);

    const userSubject = (subjectField.value || "").trim();
    let s = userSubject;
    if (!s) {
      const words = text.split(/\s+/).slice(0, 6).join(" ");
      s = (words || "thread").replace(/[\n\r]/g, " ").slice(0, 60);
    }
    const head = buildPostHead({isOp: true, num, role, replyToNum: null, subject: s});
    post.appendChild(head);

    const body = document.createElement("div");
    body.className = "body" + (opts.typing ? " typing" : "");
    if (opts.typing) {
      body.textContent = "…";
    } else {
      body.innerHTML = _renderBody(text);
    }
    post.appendChild(body);

    const clearer = document.createElement("div");
    clearer.className = "clear";
    post.appendChild(clearer);

    messagesEl.appendChild(post);
    lastPostNumber = num;
    setTimeout(() => post.scrollIntoView({behavior: "smooth", block: "end"}), 30);
    return post;
  }

  // Reply: caret + box, indented under OP
  const row = document.createElement("div");
  row.className = "reply-row lvl-1";

  const caret = document.createElement("span");
  caret.className = "caret";
  caret.textContent = ">>";
  row.appendChild(caret);

  const box = document.createElement("div");
  box.className = "reply-box";
  box.id = "p" + num;

  const head = buildPostHead({isOp: false, num, role, replyToNum: lastPostNumber, subject: ""});
  box.appendChild(head);

  const body = document.createElement("div");
  body.className = "body" + (opts.typing ? " typing" : "");
  if (opts.typing) {
    body.textContent = "…";
  } else {
    body.innerHTML = _renderBody(text);
  }
  box.appendChild(body);

  row.appendChild(box);
  messagesEl.appendChild(row);
  lastPostNumber = num;
  setTimeout(() => row.scrollIntoView({behavior: "smooth", block: "end"}), 30);
  return row;
}

async function loadHistory() {
  try {
    const r = await fetch(`/api/characters/${SLUG}/chat/sessions/${SESSION_ID}/`);
    const data = await r.json();
    (data.messages || []).forEach(m => renderPost(m.role, m.text));
  } catch(e) {}
}

async function send() {
  const text = composeEl.value.trim();
  if (!text) return;
  composeEl.value = "";
  sendBtn.disabled = true;

  renderPost("user", text);
  const typingEl = renderPost("anon", "", {typing: true});
  // Find body inside whichever node was returned (OP or row)
  const bodyEl = typingEl.querySelector(".body");

  try {
    const r = await fetch(`/api/characters/${SLUG}/chat/sessions/${SESSION_ID}/send/`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text}),
    });
    const data = await r.json();
    bodyEl.classList.remove("typing");
    if (data.anon) {
      bodyEl.innerHTML = _renderBody(data.anon.text || "(silence)");
    } else if (data.error) {
      bodyEl.textContent = "(error: " + data.error + ")";
    }
  } catch(e) {
    bodyEl.classList.remove("typing");
    bodyEl.textContent = "(network error)";
  }

  sendBtn.disabled = false;
  composeEl.focus();
}

sendBtn.addEventListener("click", send);
composeEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
  setTimeout(() => {
    composeEl.style.height = "auto";
    composeEl.style.height = Math.min(composeEl.scrollHeight, 200) + "px";
  }, 0);
});

loadHistory();
composeEl.focus();
</script>
</body>
</html>
