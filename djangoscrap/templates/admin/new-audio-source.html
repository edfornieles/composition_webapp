{% extends "layouts/admin.html" %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="content-wrapper">
  <section class="content">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-9">
          <div class="card shadow-lg">
            <div class="card-header">
              <h3 class="card-title mb-0">Create or Update Audio Source</h3>
            </div>
            <div class="card-body">
              <div class="alert alert-light border">
                Create an audio folder and upload one or many tracks. Use append mode to add more tracks later.
              </div>
              <form method="POST" action="{% url 'create_audio_source' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                  <div class="col-md-8">
                    <label class="form-label" for="audioSourceName">Audio source name</label>
                    <input id="audioSourceName" type="text" name="name" class="form-control" placeholder="inst_hotdogs_audio" required>
                  </div>
                  <div class="col-md-4 d-flex align-items-end">
                    <div class="form-check mb-2">
                      <input class="form-check-input" type="checkbox" value="on" id="appendAudioExisting" name="append_existing">
                      <label class="form-check-label" for="appendAudioExisting">Append existing</label>
                    </div>
                  </div>
                </div>
                <div class="mt-3">
                  <label class="form-label" for="audioFiles">Upload audio files</label>
                  <input id="audioFiles" type="file" name="files" class="form-control" accept="audio/*" multiple>
                  <small class="text-muted">Supported: mp3, wav, ogg, m4a, aac, flac.</small>
                </div>
                <div class="d-flex justify-content-between mt-4">
                  <a href="{% url 'audio-source-library' %}" class="btn btn-outline-secondary">Back to Audio Library</a>
                  <button type="submit" class="btn btn-success">Create / Upload</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
