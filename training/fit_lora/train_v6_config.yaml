# v6: 7B abliterated base, fresh LoRA on SINGLE-FOCUS filtered corpus.
# Goal: teach the model to tell ONE-arc stories with proper punchlines.
# Smaller dataset (313 rows) so fewer iters needed before overfit.

model: mlx-community/Josiefied-Qwen2.5-7B-Instruct-abliterated-v2-4-bit
train: true
data: /Volumes/Oom/aggregation/composition_webapp-main/training/fit_lora/data_greentext
iters: 800
batch_size: 1
learning_rate: 5.0e-5
num_layers: 24
steps_per_report: 20
steps_per_eval: 100
val_batches: 25
save_every: 200
max_seq_length: 2048
grad_checkpoint: true
adapter_path: /Volumes/Oom/aggregation/composition_webapp-main/training/fit_lora/adapters/fit_anon_v6_single_focus

lora_parameters:
  rank: 32
  dropout: 0.05
  scale: 20.0
