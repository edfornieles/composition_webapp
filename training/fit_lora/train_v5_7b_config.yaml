# v5: 7B abliterated base (uncensored, no refusal training to bleed through),
# fresh LoRA on punchline-filtered greentext corpus. Higher rank (32) for
# more stylistic capacity. ~1500 iters.

model: mlx-community/Josiefied-Qwen2.5-7B-Instruct-abliterated-v2-4-bit
train: true
data: /Volumes/Oom/aggregation/composition_webapp-main/training/fit_lora/data_greentext
iters: 1200
batch_size: 1
learning_rate: 5.0e-5
num_layers: 24
steps_per_report: 20
steps_per_eval: 150
val_batches: 25
save_every: 250
max_seq_length: 2048
grad_checkpoint: true
adapter_path: /Volumes/Oom/aggregation/composition_webapp-main/training/fit_lora/adapters/fit_anon_v5_7b_punchy

lora_parameters:
  rank: 32
  dropout: 0.05
  scale: 20.0
