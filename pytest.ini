[pytest]
DJANGO_SETTINGS_MODULE = djangoscrap.settings
python_files = test_*.py tests.py *_test.py
testpaths = djangoscrap/tests
# Keep the harness quiet by default; individual tests can opt in to logging.
addopts = -q --tb=short --strict-markers
markers =
    django_db: Django database access (pytest-django).
    network: requires live internet (skipped by default in CI).
    social: requires INSTAGRAM_USER / INSTAGRAM_PASS credentials.
    browser: requires a working Playwright Chromium install.
    slow: takes noticeably longer than a plain unit test.
filterwarnings =
    ignore::DeprecationWarning
